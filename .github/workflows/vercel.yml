# Har push par site ko Vercel pe deploy karta hai.
# Iske liye repo Settings → Secrets → Actions mein VERCEL_TOKEN hona chahiye.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_Gxb6R9ORFyGCt0pASJ3xLTAq
  VERCEL_PROJECT_ID: prj_bc9rSokdcjwWnX1UxMK6tWUbcFaG

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret missing. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Deploy
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
